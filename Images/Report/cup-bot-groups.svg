<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="Cúp tuần: 1 đầu đàn + 4 mạnh + 24 thường = 29 bot"><rect width="960" height="240" rx="18" fill="#f0f6fa"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#253343}.title{font-size:22px;font-weight:700}.small{font-size:16px}.big{font-size:31px;font-weight:700}</style><text x="30" y="39" class="title">29 bot + 1 người chơi = 30 vị trí</text><rect x="25" y="65" width="290" height="145" rx="12" fill="#eee5fb"/><text x="170" y="108" class="big" text-anchor="middle">1</text><text x="170" y="146" class="title" text-anchor="middle">Đầu đàn</text><text x="170" y="180" class="small" text-anchor="middle">130–170 điểm</text><rect x="335" y="65" width="290" height="145" rx="12" fill="#dff3f3"/><text x="480" y="108" class="big" text-anchor="middle">4</text><text x="480" y="146" class="title" text-anchor="middle">Bot mạnh</text><text x="480" y="180" class="small" text-anchor="middle">70–120 điểm</text><rect x="645" y="65" width="290" height="145" rx="12" fill="#e6edf3"/><text x="790" y="108" class="big" text-anchor="middle">24</text><text x="790" y="146" class="title" text-anchor="middle">Bot thường</text><text x="790" y="180" class="small" text-anchor="middle">8–60 điểm</text></svg>