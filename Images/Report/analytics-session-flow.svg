<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="Analytics: các điểm đo trong một lượt chơi"><rect width="960" height="240" rx="18" fill="#f0f6fa"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#253343}.title{font-size:22px;font-weight:700}.small{font-size:16px}.big{font-size:31px;font-weight:700}</style><text x="30" y="39" class="title">Đọc sự kiện theo hành trình người chơi</text><rect x="24" y="65" width="192" height="115" rx="12" fill="white" stroke="#c7dbe5"/><text x="120" y="108" text-anchor="middle" class="title">Bắt đầu</text><text x="120" y="143" text-anchor="middle" class="small">level_start</text><text x="223" y="126" class="title">→</text><rect x="252" y="65" width="192" height="115" rx="12" fill="white" stroke="#c7dbe5"/><text x="348" y="108" text-anchor="middle" class="title">Thao tác</text><text x="348" y="143" text-anchor="middle" class="small">Xe / đường / cát</text><text x="451" y="126" class="title">→</text><rect x="480" y="65" width="192" height="115" rx="12" fill="white" stroke="#c7dbe5"/><text x="576" y="108" text-anchor="middle" class="title">Hỗ trợ</text><text x="576" y="143" text-anchor="middle" class="small">Booster / ad / continue</text><text x="679" y="126" class="title">→</text><rect x="708" y="65" width="192" height="115" rx="12" fill="white" stroke="#c7dbe5"/><text x="804" y="108" text-anchor="middle" class="title">Kết quả</text><text x="804" y="143" text-anchor="middle" class="small">level_end</text><text x="30" y="217" class="small">Sơ đồ điểm đo trong client; không biểu diễn tỷ lệ hay dữ liệu người chơi thực tế.</text></svg>